name: Auto-format

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    uses: flofy/pwa-kit/.github/workflows/auto-format.yml@784fed5843b3d6c98dd9d4c3fba398c1a6ed8cda
    with:
      node-version: "24"
      pnpm-version: "10.15.1"
      install-command: pnpm install --frozen-lockfile
      format-command: pnpm run format
