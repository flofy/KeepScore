name: Auto-format

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    uses: flofy/pwa-kit/.github/workflows/auto-format.yml@301fdeae8ca5ba4e0acc4114e901433336489286
    with:
      node-version: "24"
      pnpm-version: "10.15.1"
      install-command: pnpm install --frozen-lockfile
      format-command: pnpm run format
