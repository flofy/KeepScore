name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  changes:
    name: Detect web changes
    runs-on: ubuntu-latest
    outputs:
      react: ${{ steps.filter.outputs.react }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            react:
              - 'src/**'
              - 'public/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'index.html'

  deploy:
    needs: changes
    if: needs.changes.outputs.react == 'true'
    uses: flofy/pwa-kit/.github/workflows/deploy-pages.yml@784fed5843b3d6c98dd9d4c3fba398c1a6ed8cda
    with:
      node-version: "24"
      pnpm-version: "10.15.1"
      install-command: pnpm install --frozen-lockfile
      build-command: pnpm run build
      artifact-path: dist
