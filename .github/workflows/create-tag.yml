name: Create Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example v0.1.0)"
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  create-tag:
    name: Create release tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Create tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists"
          else
            gh api               --method POST               "repos/${GITHUB_REPOSITORY}/git/refs"               -f "ref=refs/tags/${VERSION}"               -f "sha=${GITHUB_SHA}"
          fi

      - name: Build Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run android-build.yml             --repo "${GITHUB_REPOSITORY}"             --ref "${VERSION}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run release.yml             --repo "${GITHUB_REPOSITORY}"             --ref "${VERSION}"             -f "version=${VERSION}"
