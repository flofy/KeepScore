name: one-off-fix
on:
  push:
    branches: [fix/game-controls-and-pwa-updates]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply requested UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/styles.css')
          s = p.read_text()
          marker = '''.players.duo {
            grid-template-columns: 1fr;
            gap: 10px;
          }'''
          addition = '''.players.duo {
            grid-template-columns: 1fr;
            gap: 10px;
          }

          .app-shell:has(.players.duo) .quick-actions {
            left: 50%;
            right: auto;
            top: 50%;
            bottom: auto;
            transform: translate(-50%, -50%);
          }

          @media (max-width: 700px) {
            .app-shell:has(.players.duo) .quick-actions {
              top: max(16px, env(safe-area-inset-top));
              transform: translateX(-50%);
            }
          }'''
          if marker not in s:
              raise SystemExit('duo styles marker not found')
          if '.app-shell:has(.players.duo) .quick-actions' not in s:
              s = s.replace(marker, addition, 1)
          p.write_text(s)

          # Keep the quick +2/-2/+3/-3 buttons on their original click behavior.
          p = Path('src/features/game/PlayerCard.tsx')
          s = p.read_text()
          s = s.replace('''  const onQuickStepClick = (delta: number) => {
            if (longPressFired.current) {
              longPressFired.current = false;
              return;
            }
            onQuickDelta(delta);
          };

          ''', '')
          for old, new in [
              ('onClick={() => onQuickStepClick(-2)}', 'onClick={() => onQuickDelta(-2)}'),
              ('onClick={() => onQuickStepClick(-3)}', 'onClick={() => onQuickDelta(-3)}'),
              ('onClick={() => onQuickStepClick(2)}', 'onClick={() => onQuickDelta(2)}'),
              ('onClick={() => onQuickStepClick(3)}', 'onClick={() => onQuickDelta(3)}'),
          ]:
              s = s.replace(old, new)
          p.write_text(s)
          PY

          npx oxfmt src/features/game/PlayerCard.tsx src/styles.css
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/one-off-fix.yml .github/workflows/.trigger .github/workflows/.ui-fix-trigger
          git add src/features/game/PlayerCard.tsx src/styles.css .github/workflows/one-off-fix.yml .github/workflows/.trigger .github/workflows/.ui-fix-trigger
          git commit -m "fix(game): center duo actions and restore quick controls" || exit 0
          git push
