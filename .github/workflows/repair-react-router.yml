name: Prepare clean React Router repair

on:
  push:
    branches:
      - fix/react-router-clean

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[router-repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pre-router sources
        run: |
          git checkout 7f7fa4c50ecb0067e1f0aeb67d9fe5b79b2398ff -- src/ui/App.tsx src/ui/SavedGames.tsx src/ui/StartScreen.tsx src/ui/i18n.tsx src/ui/start.css

      - name: Apply clean router implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('src/ui/App.tsx')
          text = app.read_text()

          imports = """import {\n  createBrowserRouter,\n  RouterProvider,\n  useNavigate,\n  useSearchParams,\n} from 'react-router-dom'\n"""
          marker = "import './start.css';\n"
          text = text.replace(marker, marker + imports, 1)

          replacement = r'''function BackButton() {
  const { t } = useI18n();
  const navigate = useNavigate();

  return (
    <button
      className="back-button"
      type="button"
      onClick={() => navigate(-1)}
      aria-label={t('back')}
    >
      ←
    </button>
  );
}

function StartScreenRoute() {
  const navigate = useNavigate();
  return (
    <StartScreen
      onNewGame={() => navigate('/setup')}
      onChwatzi={(playerCount) => navigate('/chwatzi?players=' + String(playerCount))}
    />
  );
}

function GameSetupRoute() {
  const navigate = useNavigate();
  return (
    <GameSetup
      onCreate={(game) => {
        localGameRepository.save(game);
        navigate('/game?gameId=' + game.id);
      }}
      onBack={() => navigate('/')}
    />
  );
}

function ChwatziRoute() {
  const navigate = useNavigate();
  const [searchParams] = useSearchParams();
  const requestedCount = Number(searchParams.get('players'));
  const playerCount = Number.isInteger(requestedCount) && requestedCount >= 2 ? requestedCount : 4;
  const game = createTempGame(playerCount);

  return (
    <ChwatziScreen
      game={game}
      onSelect={(startingPlayerId) => {
        localGameRepository.save({ ...game, startingPlayerId });
        navigate('/game?gameId=' + game.id);
      }}
      onBack={() => navigate('/')}
    />
  );
}

function GameRoute() {
  const navigate = useNavigate();
  const [searchParams] = useSearchParams();
  const gameId = searchParams.get('gameId');
  const game = gameId ? localGameRepository.get(gameId) : undefined;

  useEffect(() => {
    if (!game) navigate('/');
  }, [game, navigate]);

  if (!game) return null;

  return (
    <GameScreen
      initialGame={game}
      onNewGame={() => navigate('/setup')}
      onSavedGames={() => navigate('/saved')}
      onChwatzi={() => navigate('/chwatzi?players=' + String(game.players.length))}
    />
  );
}

function SavedGamesRoute() {
  const navigate = useNavigate();
  const [games, setGames] = useState<Game[]>(() => localGameRepository.list());

  const refresh = useCallback(() => {
    setGames(localGameRepository.list());
  }, []);

  return (
    <SavedGames
      games={games}
      onResume={(game) => navigate('/game?gameId=' + game.id)}
      onDelete={(id) => {
        localGameRepository.remove(id);
        refresh();
      }}
      onBack={() => navigate(-1)}
    />
  );
}

function RouteShell({ children, showBack = true }: { children: React.ReactNode; showBack?: boolean }) {
  return (
    <div className="route-shell">
      {showBack && <BackButton />}
      {children}
    </div>
  );
}

const router = createBrowserRouter(
  [
    { path: '/', element: <RouteShell showBack={false}><StartScreenRoute /></RouteShell> },
    { path: '/setup', element: <RouteShell><GameSetupRoute /></RouteShell> },
    { path: '/chwatzi', element: <RouteShell><ChwatziRoute /></RouteShell> },
    { path: '/game', element: <RouteShell><GameRoute /></RouteShell> },
    { path: '/saved', element: <RouteShell><SavedGamesRoute /></RouteShell> },
  ],
  { basename: import.meta.env.BASE_URL },
);

export function App() {
  return <RouterProvider router={router} />;
}
'''

          text = re.sub(r"export function App\(\) \{[\s\S]*\}\s*$", replacement, text, count=1)
          if "RouterProvider" not in text or "const router = createBrowserRouter" not in text:
              raise SystemExit('Router replacement failed')
          app.write_text(text)

          saved = Path('src/ui/SavedGames.tsx')
          text = saved.read_text()
          text = text.replace("  onDelete: (id: string) => void\n", "  onDelete: (id: string) => void\n  onBack?: () => void\n")
          text = text.replace("export function SavedGames({ games, onResume, onDelete }: SavedGamesProps) {", "export function SavedGames({ games, onResume, onDelete, onBack }: SavedGamesProps) {")
          text = text.replace("    <>\n", "    <>\n      {onBack && (\n        <button className=\"saved-back-button\" type=\"button\" onClick={onBack} aria-label={t('back')}>←</button>\n      )}\n", 1)
          saved.write_text(text)
          PY

      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/repair-react-router.yml
          git add src/ui/App.tsx src/ui/SavedGames.tsx src/ui/StartScreen.tsx src/ui/i18n.tsx src/ui/start.css .github/workflows/repair-react-router.yml
          git commit -m "fix: rebuild React Router integration [router-repair]"
          git push
