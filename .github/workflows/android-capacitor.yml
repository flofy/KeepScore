name: Android Capacitor

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Capacitor Android APK
    uses: flofy/pwa-kit/.github/workflows/android-apk.yml@6b42e1254019e451a7cb829e0efb8b5063eb4b5b
    with:
      checkout-ref: ${{ inputs.ref || github.sha }}
      capacitor-directory: capacitor
      android-directory: capacitor/android
      install-command: pnpm install --frozen-lockfile
      pnpm-version: 10.15.1
      web-build-command: pnpm run build
      native-assets-command: |
        npm install --prefix .asset-tools sharp --no-package-lock --no-audit --no-fund
        node .github/scripts/rasterize-native-assets.mjs
      asset-path: assets
      generate-capacitor-assets: true
      gradle-task: assembleDebug
      apk-path: app/build/outputs/apk/debug/app-debug.apk
      artifact-name: keepscore-capacitor-debug-apk
      comment-pr-artifact: true
    secrets: inherit
