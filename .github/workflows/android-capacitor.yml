name: Android Capacitor

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "capacitor/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vite.config.*"
      - "index.html"
      - ".github/workflows/android-capacitor.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "capacitor/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vite.config.*"
      - "index.html"
      - ".github/workflows/android-capacitor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build React app and Capacitor APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install React dependencies
        run: pnpm install --frozen-lockfile

      - name: Build React app for Capacitor
        run: pnpm run build
        env:
          CAPACITOR: "true"
          VITE_CAPACITOR: "true"

      - name: Install Capacitor dependencies
        run: npm install --no-package-lock --no-audit --no-fund
        working-directory: capacitor

      - name: Generate Android project
        run: npx cap add android
        working-directory: capacitor

      - name: Sync web assets into Android
        run: npx cap sync android
        working-directory: capacitor

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: capacitor/android

      - name: Upload APK
        id: apk
        uses: actions/upload-artifact@v7
        with:
          name: keepscore-capacitor-debug-apk
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Add APK link to pull request
        if: github.event_name == "pull_request"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_ID: ${{ steps.apk.outputs.artifact-id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          artifact_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts/$ARTIFACT_ID"
          marker="<!-- keepscore-capacitor-apk-artifact -->"
          body=$(printf '%s\n\n📱 **Capacitor Android APK built successfully**\n\n[Download APK artifact](%s)' "$marker" "$artifact_url")
          comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- keepscore-capacitor-apk-artifact -->")) | .id' | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi
