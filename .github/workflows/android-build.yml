name: Android Build

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main, rust-android-port]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  changes:
    name: Detect Android changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      android: ${{ steps.filter.outputs.android }}
      capacitor: ${{ steps.filter.outputs.capacitor }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            android:
              - 'android/**'
              - 'rust/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/android-build.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/create-tag.yml'
            capacitor:
              - 'src/**'
              - 'public/**'
              - 'capacitor/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'index.html'
              - '.github/workflows/android-capacitor.yml'
              - '.github/workflows/android-build.yml'

  capacitor:
    name: Capacitor Android APK
    needs: changes
    if: needs.changes.outputs.capacitor == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install React dependencies
        run: pnpm install --frozen-lockfile

      - name: Build React app for Capacitor
        run: pnpm run build
        env:
          CAPACITOR: "true"
          VITE_CAPACITOR: "true"

      - name: Install Capacitor dependencies
        run: npm install --no-package-lock --no-audit --no-fund
        working-directory: capacitor

      - name: Generate Android project
        run: npx cap add android
        working-directory: capacitor

      - name: Sync web assets into Android
        run: npx cap sync android
        working-directory: capacitor

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: capacitor/android

      - name: Upload Capacitor APK artifact
        id: capacitor-apk
        uses: actions/upload-artifact@v7
        with:
          name: keepscore-capacitor-debug-apk
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Add Capacitor APK link to pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_ID: ${{ steps.capacitor-apk.outputs.artifact-id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          artifact_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts/$ARTIFACT_ID"
          marker="<!-- keepscore-capacitor-apk-artifact -->"
          body=$(printf '%s\\n\\n📱 **Capacitor Android APK built successfully**\\n\\n[Download APK artifact](%s)' "$marker" "$artifact_url")
          comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \\
            --jq '.[] | select(.body | contains("<!-- keepscore-capacitor-apk-artifact -->")) | .id' | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi

  rust:
    name: Rust (fmt, test, build)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: rust
      - name: Run tests
        run: cargo test
        working-directory: rust
      - name: Build (host)
        run: cargo build
        working-directory: rust

  android:
    name: Android APK
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;29.0.14206865"
          yes | sdkmanager --licenses >/dev/null || true
          test -d "$ANDROID_SDK_ROOT/ndk/29.0.14206865"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
          components: rust-src
      - name: Configure Cargo for rust-android-gradle
        run: |
          CARGO_BIN="$(rustup which cargo)"
          RUSTC_BIN="$(rustup which rustc)"
          echo "RUST_ANDROID_GRADLE_CARGO_COMMAND=$CARGO_BIN" >> "$GITHUB_ENV"
          echo "RUST_ANDROID_GRADLE_RUSTC_COMMAND=$RUSTC_BIN" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: android
      - name: Upload APK artifact
        id: apk-artifact
        uses: actions/upload-artifact@v7
        with:
          name: keepscore-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Add APK link to pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_ID: ${{ steps.apk-artifact.outputs.artifact-id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          artifact_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts/$ARTIFACT_ID"
          marker="<!-- keepscore-apk-artifact -->"
          body=$(printf '%s\\n\\n📱 **Android APK built successfully**\\n\\n[Download the APK artifact](%s)' "$marker" "$artifact_url")

          comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \\
            --jq '.[] | select(.body | contains("<!-- keepscore-apk-artifact -->")) | .id' | head -n 1)"

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \\
              -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \\
              -f body="$body" >/dev/null
          fi
