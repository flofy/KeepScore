name: Quality Checks

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      react: ${{ steps.filter.outputs.react }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            react:
              - 'src/**'
              - 'public/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'playwright.config.*'
              - 'vitest.config.*'
              - 'index.html'

  quality:
    name: React quality
    needs: changes
    if: needs.changes.outputs.react == 'true'
    uses: flofy/pwa-kit/.github/workflows/quality-checks.yml@301fdeae8ca5ba4e0acc4114e901433336489286
    with:
      node-version: "24"
      pnpm-version: "10.15.1"
      install-command: pnpm install --frozen-lockfile
      checks-command: |
        pnpm run knip
        pnpm run test:coverage
