name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test -- --run
