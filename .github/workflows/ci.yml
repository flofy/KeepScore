name: Quality Checks
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Knip
        run: npm run knip

      - name: Run Madge
        run: npm run madge

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run Snyk
        run: npm run snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}