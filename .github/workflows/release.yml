name: Release

on:
  workflow_call:
    inputs:
      version:
        description: "Release tag"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release commit
        id: release_commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --jq '.object.sha')"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Find Android Build
        id: android_run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
        run: |
          for attempt in {1..60}; do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android-build.yml/runs?per_page=50"               --jq '.workflow_runs | map(select(.head_sha == env.RELEASE_SHA)) | sort_by(.created_at) | reverse | .[0] | [.id, .status, (.conclusion // "")] | @tsv')"
            if [[ -n "$run" ]]; then
              read -r run_id status conclusion <<< "$run"
              echo "Android Build run $run_id: $status $conclusion"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] || exit 1
                echo "id=$run_id" >> "$GITHUB_OUTPUT"
                break
              fi
            fi
            sleep 10
          done
          test -n "${{ steps.android_run.outputs.id }}"

      - name: Find APK artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.android_run.outputs.id }}
        run: |
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts"             --jq '.artifacts[] | select(.name == "keepscore-debug-apk" and .expired == false) | .id' | head -n 1)"
          test -n "$artifact_id"
          echo "id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
        run: |
          mkdir -p dist
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/apk.zip
          unzip -o /tmp/apk.zip -d dist
          apk="$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          mv "$apk" "dist/KeepScore-${{ inputs.version }}.apk"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "dist/KeepScore-$VERSION.apk" --clobber
          else
            gh release create "$VERSION" "dist/KeepScore-$VERSION.apk" --generate-notes
          fi
