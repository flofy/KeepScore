name: Release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release commit
        id: release_commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" \
            --jq '.object.sha')"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Wait for Android Build
        id: android_run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
        run: |
          for attempt in {1..60}; do
            run="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/android-build.yml/runs?event=push&per_page=20" \
              --jq '.workflow_runs | map(select(.head_sha == env.RELEASE_SHA)) | .[0] | [.id, .status, (.conclusion // "")] | @tsv')"

            if [[ -n "$run" ]]; then
              read -r run_id status conclusion <<< "$run"
              echo "Android Build run $run_id: $status $conclusion"

              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "Android Build failed."
                  exit 1
                fi
                echo "id=$run_id" >> "$GITHUB_OUTPUT"
                break
              fi
            fi

            sleep 10
          done

          test -n "${{ steps.android_run.outputs.id }}"

      - name: Find APK artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.android_run.outputs.id }}
        run: |
          artifact_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "keepscore-debug-apk" and .expired == false) | .id' \
            | head -n 1)"

          test -n "$artifact_id"
          echo "id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
        run: |
          mkdir -p dist
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/apk-artifact.zip
          unzip -o /tmp/apk-artifact.zip -d dist
          apk="$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          echo "APK found: $apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          VERSION: ${{ github.ref_name }}
        run: mv "$APK_PATH" "dist/KeepScore-${VERSION}.apk"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" "dist/KeepScore-${VERSION}.apk" --clobber
          else
            gh release create "${VERSION}" \
              "dist/KeepScore-${VERSION}.apk" \
              --generate-notes
          fi
