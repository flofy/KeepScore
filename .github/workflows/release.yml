name: Release

on:
  workflow_run:
    workflows: ["Android Build"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Create GitHub Release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Find APK artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          artifact_id="$(gh api             "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts"             --jq '.artifacts[] | select(.name == "keepscore-debug-apk" and .expired == false) | .id'             | head -n 1)"

          test -n "$artifact_id"
          echo "id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
        run: |
          mkdir -p dist
          gh api             "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"             > /tmp/apk.zip
          unzip -o /tmp/apk.zip -d dist
          test -f dist/app-debug.apk

      - name: Rename APK
        env:
          VERSION: ${{ github.event.workflow_run.head_branch }}
        run: mv dist/app-debug.apk "dist/KeepScore-${VERSION}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.workflow_run.head_branch }}
        run: |
          gh release create "${VERSION}"             "dist/KeepScore-${VERSION}.apk"             --generate-notes
