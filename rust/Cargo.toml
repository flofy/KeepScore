[package]
name = "keepscore"
version = "0.1.0"
edition = "2021"

[lib]
name = "keepscore"
crate-type = ["cdylib"]

[dependencies]
android-activity = "0.4.4"
jni = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4.0"
thiserror = "1.0"
log = "0.4.20"
android-logger = "0.2.0"
