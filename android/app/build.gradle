plugins {
    id 'com.android.application'
    id 'org.mozilla.rust-android-gradle.rust-android'
}

android {
    namespace 'com.keepscore'
    compileSdk 34
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.keepscore'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Cross-compile the Rust crate into jniLibs for each Android ABI.
cargo {
    module = '../rust'
    libname = 'keepscore'
    targets = ['arm', 'arm64', 'x86', 'x86_64']
}

afterEvaluate {
    // Build the Rust library as part of the regular Android build.
    android.applicationVariants.all { variant ->
        def buildType = "${variant.buildType.name.capitalize()}"
        tasks["generate${buildType}Assets"].dependsOn(tasks['cargoBuild'])
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}
